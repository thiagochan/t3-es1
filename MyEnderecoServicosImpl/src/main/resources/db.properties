# Configuração lida por unioeste.apoio.bd.ConexaoBD (MyInfraAPI).
# H2 em memória: o banco existe enquanto a aplicação estiver rodando.
# DB_CLOSE_DELAY=-1 impede que o H2 apague o banco quando a última conexão fecha.
db.url=jdbc:h2:mem:t3es1;DB_CLOSE_DELAY=-1
db.usuario=sa
db.senha=
db.pool.max=10

# Executados uma única vez, quando o pool é criado: tabelas e dados iniciais.
db.scripts=/sql/endereco-schema.sql,/sql/endereco-dados.sql
